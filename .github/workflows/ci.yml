name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # conftest.py points DITHERRA_DATA at a tmpdir and clears provider keys,
      # so the suite never touches real data and never spends real credit.
      - name: Run tests
        run: pytest -q

      # The README tells people to run this; if it breaks, the README lies.
      - name: Check the provider registry loads
        run: python providers.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit --incremental false

      - name: Build the static export
        run: npm run build

      # Not wired up yet: `npm run lint` still reports the untyped catch clauses
      # the README lists under "Project status". Add the step once they are gone,
      # so a red run always means something new broke.
